<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Cadastro | Pizza Express</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background-color: #111111;
            color: #ffffff;
        }

        .container {
            width: 90%;
            max-width: 600px;
            margin: 50px auto;
            background-color: #202020;
            padding: 35px;
            border-radius: 12px;
        }

        h1 {
            color: #ffc400;
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            background-color: #b30000;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            background-color: #ffc400;
            color: #111111;
        }

        a {
            color: #ffc400;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>Cadastro de Cliente</h1>

    <form>

        <label>Nome completo</label>
        <input type="text" id="nome" required>

        <label>Email</label>
        <input type="email" id="email" required>

        <label>Telefone</label>
       <input type="tel" id="telefone" required>

        <label>Endereço</label>
        <input type="text" id="endereco" required>

        <button
            type="button"
            onclick="alert('Cliente cadastrado com sucesso!')"
        >
            Cadastrar
        </button>

    </form>

    <p>
        <a href="index.html">
            Voltar para o delivery
        </a>
    </p>

</div>

</body>
</html>
